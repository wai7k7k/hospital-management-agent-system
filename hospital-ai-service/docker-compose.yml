version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: hospital-ai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hospital_ai
    networks:
      - hospital-ai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: hospital-ai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    networks:
      - hospital-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI 服务
  hospital-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-ai-service
    ports:
      - "8000:8000"
    environment:
      # 应用配置
      APP_NAME: hospital-ai-service
      APP_ENV: production
      DEBUG: false

      # 通义千问配置
      DASH_SCOPE_API_KEY: ${DASH_SCOPE_API_KEY}
      QWEN_MODEL: qwen-plus
      QWEN_TEMPERATURE: 0.7
      QWEN_MAX_TOKENS: 2000

      # Pinecone 配置
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENVIRONMENT: us-east-1
      PINECONE_INDEX: hospital-ai-index
      PINECONE_DIMENSION: 1536

      # MongoDB 配置
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: hospital_ai

      # RabbitMQ 配置
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
      RABBITMQ_VHOST: /

      # 服务器配置
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      LOG_LEVEL: INFO

      # CORS 配置
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:82

      # 医院 API 配置
      HOSPITAL_API_BASE_URL: http://ruoyi-gateway:8080
      HOSPITAL_API_TIMEOUT: 30
    volumes:
      - ./logs:/app/logs
    networks:
      - hospital-ai-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus (监控)
  prometheus:
    image: prom/prometheus:latest
    container_name: hospital-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hospital-ai-network
    restart: unless-stopped

  # Grafana (可视化)
  grafana:
    image: grafana/grafana:latest
    container_name: hospital-ai-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    networks:
      - hospital-ai-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  hospital-ai-network:
    driver: bridge
